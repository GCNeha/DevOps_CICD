name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "starter/backend/**"

  workflow_dispatch:

jobs:
  generate-lock:
    name: Generate Backend Lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Generate Pipfile.lock
        working-directory: starter/backend
        run: pipenv lock

      - name: Upload Pipfile.lock
        uses: actions/upload-artifact@v4
        with:
          name: backend-pipfile-lock
          path: starter/backend/Pipfile.lock

  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

    build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs:
      - generate-lock
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: backend-pipfile-lock
          path: starter/backend

      - name: Build Docker image
        working-directory: starter/backend
        run: docker build --tag mp-backend:latest .